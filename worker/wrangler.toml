name = "hoops-tracker-mcp"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
# Base URL of the GitHub Pages site whose /api/*.json this server reads.
DATA_URL = "https://ethanperello.github.io/hoops-tracker"

# Default Sleeper dynasty league; individual tools can override with league_id.
# MCP exposes get_matchup and get_transactions with short-cache Sleeper data.
DEFAULT_LEAGUE_ID = "1408140530877042688"
